<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form Input Biodata</title>
  </head>

  <body>
    <form>
      <table
        border="1"
        bordercolor="lightsteelblue"
        width="785"
        cellpadding="10"
        align="center"
      >
        <tr>
          <th colspan="3">Form Input Biodata</th>
        </tr>

        <tr>
          <td colspan="3">
            <table border="0" width="100%" cellpadding="4">
              <tr>
                <td width="120">Nama Lengkap</td>
                <td width="10">:</td>
                <td>
                  <input type="text" name="nama" />
                </td>
              </tr>

              <tr>
                <td>Tempat, Tanggal Lahir</td>
                <td>:</td>
                <td>
                  <input type="text" />
                  <input type="date" name="lahir" />
                </td>
              </tr>

              <tr>
                <td>Alamat</td>
                <td>:</td>
                <td>
                  <textarea name="alamat" cols="38" rows="4"></textarea>
                </td>
              </tr>

              <tr>
                <td>No.Telp/HP</td>
                <td>:</td>
                <td>
                  <input type="number" name="No.HP" />
                </td>
              </tr>

              <tr>
                <td>Jenis Kelamin</td>
                <td>:</td>
                <td>
                  <input type="radio" name="jk" value="Laki-Laki" />Laki-Laki
                  <input type="radio" name="jk" value="Perempuan" />Perempuan
                </td>
              </tr>

              <tr>
                <td>Agama</td>
                <td>:</td>
                <td>
                  <select name="agama">
                    <option value="islam">islam</option>
                    <option value="kristen">kristen</option>
                    <option value="katolik">katolik</option>
                    <option value="hindu">hindu</option>
                    <option value="buddha">buddha</option>
                    <option value="konghucu">konghucu</option>
                  </select>
                </td>
              </tr>

              <tr>
                <td>Hoby</td>
                <td>:</td>
                <td>
                  <input type="checkbox" name="hoby" value="Basket" />Basket
                  <input type="checkbox" name="hoby" value="Game" />Bermain Game
                  <input
                    type="checkbox"
                    name="hoby"
                    value="Musik"
                  />Mendengarkan Musik
                  <input
                    type="checkbox"
                    name="hoby"
                    value="Badminton"
                  />Badminton
                </td>
              </tr>

              <tr>
                <td colspan="3" align="center">
                  <input type="submit" value="Submit" />
                  <input type="reset" value="Reset" />
                </td>
              </tr>
            </table>
          </td>
        </tr>
      </table>
    </form>
  </body>
</html>
