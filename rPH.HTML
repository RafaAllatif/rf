<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Makanan</title>

    <style>
        body {
            font-family: arial, sans-serif, ;
            background-color: #a58d6e;
        }

        table {
            margin: 30px auto;
            background-color: rgb(255, 255, 255);
            padding: 20px;
            border-radius: 30px;
            width: 400px;
        }

        h2 {
            color: #492c06;
            text-align: center;
        }

        ul {
            padding: 0px;
            list-style-position: inside;
        }

        li {
            font-size: 18px;
            margin-top: 15px;
        }

        img {
            width: 150px;
            display: block;
            margin: 0 auto 15px;
            border-radius: 17px;
        }

        .harga {
            color: #8b592a;
            font-weight: bold;
        }

        hr {
            border: None ;
            border-top: 2px solid #492c06;
        }
    </style>
</head>

<body>

    <table>
        <tr>
            <td>
                <h2>Menu Makanan</h2>

                <ul type ="square">
                    <img src="Img/Nasi-Goreng-ayam-terasi-1.jpg"
                         alt="Nasi Goreng Ayam Terasi" height="150">
                    <li>Nasi Goreng Ayam Terasi</li>
                    <div class="harga">Rp.50.000</div>
                    <hr>

                    <img src="Img/Bakso.jpg" alt="">
                    <li>Bakso</li>
                    <div class="harga">Rp.20.000</div>
                    <hr>

                    <img src="Img/Mie ayam.jpg" alt="">
                    <li>Mie Ayam</li>
                    <div class="harga">Rp.17.000</div>
                    <hr>

                    <img src="Img/Es teh.jpg" height="150">
                    <li>Es Teh</li>
                    <div class="harga">Rp.5.000</div>
                    <hr>

                    <img src="Img/Kentang goreng.jpg">
                    <li>Kentang Goreng</li>
                    <div class="harga">Rp.15.000</div>
                </ul>

            </td>
        </tr>
    </table>

</body>
</html>
